<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js" defer></script>
</head>
<body>
    <h1>Study Planner</h1>
    <div id="countdown" class="countdown" role="status"></div>

    <form id="exam-form">
        <div>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" required>
        </div>

        <div>
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required>
        </div>

        <div>
            <label for="time">Time</label>
            <input id="time" name="time" type="time" required>
        </div>

        <div style="align-self: flex-end;">
            <button type="submit">Add exam</button>
        </div>
    </form>

    <p class="error" id="error" role="alert"></p>

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Date</th>
                <th>Time</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="exam-list"></tbody>
    </table>
    <p class="empty" id="empty">No exams yet.</p>
	<section id="study-plan-section">
	    <h2>Study Plan</h2>
	    <div id="empty-plan-message" style="display:none;">
	      <p class="empty">No plan yet — add an exam.</p>
	    </div>
	    <table id="plan-table" style="display:none;">
	      <thead><tr><th>Date</th><th>Subject</th><th>Task</th></tr></thead>
	      <tbody id="plan-table-body"></tbody>
	    </table>
	  </section>
</body>
</html>
