<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    h1, h2 { font-size: 1.6rem; }
    form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 2px; }
    input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:focus-visible, input:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
    .error { color: #b91c1c; margin-top: 8px; min-height: 1.2em; }
    .empty { color: #666; font-style: italic; }
    section { margin-top: 40px; }
  </style>
</head>
<body>
    <h1>Study Planner</h1>
    <div id="countdown" class="countdown" role="status"></div>

    <form id="exam-form">
        <div>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" required>
        </div>

        <div>
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required>
        </div>

  <!-- Секция Study Plan -->
  <section id="study-plan-section" tabindex="0" aria-label="Study Plan">
      <h2>Study Plan</h2>
      
      <!-- Сообщение для пустого состояния -->
      <div id="empty-plan-message" style="display: none;">
          <p class="empty">No plan yet — add an exam.</p>
      </div>

      <!-- Таблица плана -->
      <table id="plan-table" border="1" tabindex="0">
          <thead>
              <tr>
                  <th scope="col">Date</th>
                  <th scope="col">Subject</th>
                  <th scope="col">Activity</th>
              </tr>
          </thead>
          <tbody id="plan-table-body">
              <!-- Сюда JS вставляет строки -->
          </tbody>
      </table>
  </section>

  <script>
    const list = document.getElementById('exam-list');
    const empty = document.getElementById('empty');
    const error = document.getElementById('error');

    async function loadExams() {
      const res = await fetch('/api/exams');
      const exams = await res.json();
      list.innerHTML = '';
      empty.style.display = exams.length ? 'none' : 'block';
      for (const e of exams) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${e.subject}</td><td>${e.date}</td><td>${e.time}</td>`;
        const del = document.createElement('td');
        const btn = document.createElement('button');
        btn.textContent = 'Delete';
        btn.onclick = () => deleteExam(e.id);
        del.appendChild(btn);
        tr.appendChild(del);
        list.appendChild(tr);
      }
      // Обновляем таблицу плана вместе с экзаменами
      loadStudyPlan();
    }

    <p class="error" id="error" role="alert"></p>

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Date</th>
                <th>Time</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="exam-list"></tbody>
    </table>

    function loadStudyPlan() {
        const today = new Date().toISOString().split('T')[0];

        fetch('/api/plan?startDate=' + today)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch plan');
                }
                return response.json();
            })
            .then(data => {
                const emptyMessage = document.getElementById('empty-plan-message');
                const planTable = document.getElementById('plan-table');
                const tableBody = document.getElementById('plan-table-body');

                tableBody.innerHTML = '';

                if (!data || data.length === 0) {
                    emptyMessage.style.display = 'block';
                    planTable.style.display = 'none';
                    return;
                }

                emptyMessage.style.display = 'none';
                planTable.style.display = 'table';

                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.setAttribute('tabindex', '0');
                    row.innerHTML = `
                        <td>${item.date}</td>
                        <td>${item.subject}</td>
                        <td><strong>${item.activity}</strong></td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => console.error('Error loading study plan:', error));
    }

    loadExams();
  </script>
</body>
</html>
